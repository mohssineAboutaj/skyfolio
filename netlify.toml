[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"

# Explicit production context (deployed from the `release` branch)
[context.production]
  command = "npm run generate"

[context.production.environment]
  NODE_VERSION = "22"

# Long-cache hashed Nuxt assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep HTML fresh so releases are visible promptly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Unknown routes fall through to the generated _redirects rule
# (/* -> /404.html with status 404), so missing pages return a real 404.
