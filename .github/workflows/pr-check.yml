name: Pull Request Check

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './coverage/lcov.info';

            let coverageComment = '## 🧪 Test Results\n\n';
            coverageComment += '✅ All tests passed successfully!\n\n';

            if (fs.existsSync(coveragePath)) {
              const coverage = fs.readFileSync(coveragePath, 'utf8');
              const lines = coverage.split('\n');
              const summary = lines.find(line => line.startsWith('SF:'));
              
              if (summary) {
                coverageComment += '📊 Coverage report generated\n';
                coverageComment += '📁 Coverage files available in artifacts\n\n';
              }
            }

            coverageComment += '### Test Summary\n';
            coverageComment += '- ✅ Unit Tests: Passed\n';
            coverageComment += '- ✅ E2E Tests: Passed\n';
            coverageComment += '- ✅ Coverage: Generated\n\n';
            coverageComment += '🚀 Ready for review!';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageComment
            });
